defaults:
  - _self_
  - dataset: yandex
  - parameter/examination: position
  - parameter/attraction: embedding/full
  - parameter/satisfaction: embedding/full
  - model: pbm

random_state: 42
dataset_dir: ./clax-datasets
result_dir: ./clax-results
experiment: "2-yandex-compression"

# Configure for the hashing trick / QR embeddings:
compression_ratio: 1

# Configure based on available hardware:
train_batch_size: 4096
eval_batch_size: 8192
num_workers: 8

# Configure training:
learning_rate: 0.003
epochs: 100

# Overwritten by the selected Yandex dataset config:
query_doc_pairs: 346_711_929
positions: 10

# Select dataset ranges in [0, 146_278_823], overwritten in main.sh:
train_sessions: [ 0,10_000_000 ]
val_sessions: [ 10_000_000,15_000_000 ]
test_sessions: [ 15_000_000,20_000_000 ]

# Add clax base configs (so that you can select them in the defaults list):
hydra:
  searchpath:
    - pkg://clax.config
    - file://${oc.env:PWD}/../config
