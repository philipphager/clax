defaults:
  - _self_
  - dataset: baidu-ultr
  - parameter/examination: position
  - parameter/attraction: embedding/hash
  - parameter/satisfaction: embedding/hash
  - model: pbm

random_state: 42
dataset_dir: ./clax-datasets
result_dir: ./clax-results
experiment: "3-baidu-ultr-embeddings"

# Compress the number embeddings using the hashing trick:
compression_ratio: 10

# Configure based on available hardware:
train_batch_size: 4096
eval_batch_size: 8192
num_workers: 8

# Configure training:
learning_rate: 0.003
epochs: 100

# Overwritten by the selected Baidu-ULTR dataset config:
query_doc_pairs: 2_147_483_647
positions: 10

# Select dataset ranges in [0, 1_210_257_130], overwritten in main.sh:
train_sessions: [0, 800_000_000]
val_sessions: [800_000_000, 1_000_000_000]
test_sessions: [1_000_000_000, 1_210_257_130]

# Add clax base configs (so that you can select them in the defaults list):
hydra:
  searchpath:
    - pkg://clax.config
    - file://${oc.env:PWD}/../config
