# @package _global_

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    mem_gb: 48
    cpus_per_task: 16
    array_parallelism: 8
    timeout_min: 3600
    partition: gpu
    gres: gpu:1
    additional_parameters:
      nodelist: ilps-cn116,ilps-cn117,ilps-cn118

dataset: /ivi/ilps/datasets/yandex/relevance_prediction/YandexClicks.txt
