# @package _global_

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    mem_gb: 32
    cpus_per_task: 14
    array_parallelism: 8
    timeout_min: 3600
    partition: gpu
    gres: gpu:nvidia_rtx_a6000:1

batch_size: 4096
dataset: /ivi/ilps/datasets/yandex/relevance_prediction/YandexClicks.txt
