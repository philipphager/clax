[project]
name = "clax"
version = "0.1.0"
description = "A fast and flexible library for gradient-based click models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.6.0",
    "flax>=0.10.6",
    "optax>=0.2.4",
    "pyarrow>=21.0.0",
    "rax>=0.4.0",
    "torch>=2.7.0",
    "progress-table>=3.1.2",
    "hydra-core>=1.3.2",
    "pandas>=2.3.2",
]
